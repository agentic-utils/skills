name: github plugin

on:
  pull_request:
    paths: ['plugins/github/**', '.github/workflows/github-plugin.yml']
  push:
    branches: [main]
    paths: ['plugins/github/**', '.github/workflows/github-plugin.yml']

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: plugins/github
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10 # the build check compares minified output, which changes between Bun versions
      - run: bun test
      # server.js is what the plugin runs, so it must match the source
      - run: bun run build && git diff --exit-code server.js
